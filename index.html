<title>Book Typesetter</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#14213d"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Typesetter">

<style>
:root{--navy:#14213d;--navy2:#1d2e52;--gold:#c9a227;--ink:#e8ebf2;--desk:#2a3550}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 "Inter",system-ui,sans-serif;background:var(--desk);color:var(--ink);height:100vh;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--navy);border-bottom:2px solid var(--gold)}
header h1{font-size:16px;margin:0 auto 0 0;font-weight:700}
button,select,input,textarea{font:inherit}
button{background:var(--navy2);color:var(--ink);border:1px solid #3b4d7a;border-radius:6px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--gold)}button.pri{background:var(--gold);color:#1a1a1a;border-color:var(--gold);font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
main{flex:1;display:flex;min-height:0}
aside{width:340px;flex:none;background:var(--navy);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex}.tabs button{flex:1;border-radius:0;border:0;border-bottom:2px solid transparent;background:none;padding:10px 4px;font-size:13px}
.tabs button.on{border-color:var(--gold);color:var(--gold)}
.panel{padding:12px 14px;overflow:auto;display:none;gap:10px;flex-direction:column}.panel.on{display:flex}
label{display:flex;justify-content:space-between;align-items:center;gap:10px}
label input[type=number],label select,label input[type=text]{width:150px;background:#0e182e;color:var(--ink);border:1px solid #3b4d7a;border-radius:5px;padding:5px}
label.c{justify-content:flex-start}
textarea{width:100%;min-height:340px;background:#0e182e;color:var(--ink);border:1px solid #3b4d7a;border-radius:5px;padding:8px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.hint{font-size:12px;opacity:.7;margin:0}
#view{flex:1;overflow:auto;padding:18px}
#bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
#sheet{display:flex;flex-direction:column;align-items:center;gap:18px;transform-origin:top center}
.row{display:flex;gap:0;box-shadow:0 6px 22px rgba(0,0,0,.45)}.spacer{background:transparent}
</style>
<style id="pagecss">
.page{position:relative;background:#fffdf8;overflow:hidden;flex:none}
.page .bd{position:absolute;overflow:hidden}
.page .hd,.page .ft{position:absolute;font-size:.8em;text-align:center;font-style:italic;line-height:1}
.page .ft{font-style:normal}
.page p{margin:0}
.page h1{font-weight:500;font-size:2em;text-align:center;margin:0 0 1.6em;line-height:1.15;hyphens:manual}
.page h2{font-weight:500;font-size:1.2em;text-align:center;margin:1.6em 0 1em;hyphens:manual}
.page .br{text-align:center;margin:1em 0}
.page .q{margin:.8em 1.5em;font-size:.95em;font-style:italic}
.page .tp{text-align:center;margin-top:30%}.page .tp h1{font-size:2.6em}
.page .dc::first-letter{float:left;font-size:3.3em;line-height:.8;padding:.06em .08em 0 0}
.page .dc.cont::first-letter{float:none;font-size:inherit;line-height:inherit;padding:0}
.page .split{text-align-last:justify}
</style>
<style id="book"></style><style id="pr"></style>
<style>
@media print{body{display:block;height:auto;background:#fff}header,aside,#bar{display:none!important}main,#view{display:block;padding:0;overflow:visible}
#sheet{zoom:1!important;display:block}.row{display:block;box-shadow:none}.spacer{display:none}
.page{break-after:page;page-break-after:always;box-shadow:none}.page .bd{outline:none!important}}
.guides .bd{outline:1px dashed rgba(200,40,40,.5)}
@media(max-width:800px){main{flex-direction:column}aside{width:auto;max-height:45vh}}
</style></head><body>

$("#bLoad").onclick=()=>{$("#fIn").onchange=async e=>{Object.assign(D,JSON.parse(await e.target.files[0].text()));build();go()};$("#fIn").click()};

 $("#bDS").onclick=()=>g.withSuccessHandler(r=>alert("Saved to Drive: "+r.name)).withFailureHandler(e=>alert(e.message)).saveProject(JSON.stringify(D));
 $("#bDO").onclick=()=>g.withSuccessHandler(l=>{if(!l.length)return alert("No saved projects yet.");const n=+prompt(l.map((f,i)=>i+1+". "+f.name).join("\n")+"\n\nEnter a number:");if(l[n-1])g.withSuccessHandler(j=>{Object.assign(D,JSON.parse(j));build();go()}).loadProject(l[n-1].id)}).listProjects()}
try{const sv=localStorage.getItem("booktype");if(sv){Object.assign(D,JSON.parse(sv));build()}}catch(e){}

/* ===== Chapter + page-number helpers and Word (.docx) export =====
   Paste this whole block into index.html, directly above the final  go();  line. */
const NUMW="Zero One Two Three Four Five Six Seven Eight Nine Ten Eleven Twelve Thirteen Fourteen Fifteen Sixteen Seventeen Eighteen Nineteen".split(" "),TENS="_ _ Twenty Thirty Forty Fifty Sixty Seventy Eighty Ninety".split(" ");
const W2=n=>n<20?NUMW[n]:n<100?TENS[n/10|0]+(n%10?"-"+NUMW[n%10]:""):String(n);
function roman(n){let r="";[[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]].forEach(([v,c])=>{while(n>=v){r+=c;n-=v}});return r}
function chLab(n){const l=D.chLabel;return l=="Chapter 1"?"Chapter "+n:l=="Chapter One"?"Chapter "+W2(n):l=="Chapter I"?"Chapter "+roman(n):l=="1"?""+n:l=="I"?roman(n):""}
function pnFmt(n){const f=D.pnFmt;return f=="roman-lower"?roman(n).toLowerCase():f=="roman-upper"?roman(n):f=="alpha"&&n>=1&&n<=26?String.fromCharCode(96+n):""+n}

 const S=secs.filter(z=>z.x.length);
 /* section properties: page size, mirrored margins, number format, first-page header/footer */
 const fmt={"roman-lower":"lowerRoman","roman-upper":"upperRoman",alpha:"lowerLetter"}[s.pnFmt]||"decimal";
 const hf=`<w:headerReference w:type="default" r:id="rId11"/><w:headerReference w:type="even" r:id="rId12"/><w:headerReference w:type="first" r:id="rId13"/><w:footerReference w:type="default" r:id="rId14"/><w:footerReference w:type="even" r:id="rId15"/><w:footerReference w:type="first" r:id="rId16"/>`;

  return `<w:sectPr>${z.k=="tp"?"":hf}<w:type w:val="${i&&s.rect&&z.k=="ch"?"oddPage":"nextPage"}"/><w:pgSz w:w="${tw(s.w)}" w:h="${tw(s.h)}"/><w:pgMar w:top="${tw(s.mt)}" w:right="${tw(s.mo)}" w:bottom="${tw(s.mb)}" w:left="${tw(s.mi)}" w:header="${tw(s.mt/2)}" w:footer="${tw(s.mb/2)}" w:gutter="0"/><w:pgNumType w:fmt="${fmt}"${st}/>${z.k=="ch"?"<w:titlePg/>":""}</w:sectPr>`};
 const bodyXml=S.map((z,i)=>{const sp=sect(z,i);if(i==S.length-1)return z.x.join("")+sp;
  const q=z.x.pop(),k=q.lastIndexOf("</w:pPr>");z.x.push(q.slice(0,k)+sp+q.slice(k));return z.x.join("")}).join("");

 /* headers and footers; Word fields keep page numbers and chapter names live */
 const hs=Math.round(fs2*s.hfSize/100),al=(a,rec)=>a=="center"?"center":(a=="outside")==rec?"right":"left";
 const tok=t=>(s.pn?t:t.replace(/\{page\}/g,"")).replace(/\{title\}/g,sm(s.title)).replace(/\{author\}/g,sm(s.author));
 function hfPart(tag,tpl,a,rec,rule){const t=tok(tpl||"").trim(),rpr=`<w:rPr>${tag=="hdr"&&s.hfItal?"<w:i/>":""}<w:sz w:val="${hs}"/><w:szCs w:val="${hs}"/></w:rPr>`;
  const inner=t.split(/(\{page\}|\{chapter\})/).map(x=>x=="{page}"?`<w:fldSimple w:instr=" PAGE "><w:r>${rpr}<w:t>1</w:t></w:r></w:fldSimple>`:x=="{chapter}"?`<w:fldSimple w:instr=" STYLEREF &quot;Heading 1&quot; "><w:r>${rpr}<w:t>${X(firstTitle)}</w:t></w:r></w:fldSimple>`:x?`<w:r>${rpr}<w:t xml:space="preserve">${X(x)}</w:t></w:r>`:"").join("");
